<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<title>你是傻子吗？</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2292%22>%F0%9F%92%97</text></svg>">

<style>
/* ───────────── tokens ───────────── */
:root{
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --pink: #ff6f9c;
  --pink-deep: #ea4a80;
  --ink: #3d2230;
  --ink-soft: #86626f;
  --glass: rgba(255, 255, 255, .72);
}

*{ box-sizing: border-box; }

html, body{ height: 100%; }

body{
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  background:
    radial-gradient(120% 90% at 18% 6%, #fff7fa 0%, #ffe6f0 34%, #ffd3e4 62%, #f6c0da 100%);
  font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Hiragino Sans GB",
               "Noto Sans SC", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* soft drifting light blobs — depth, not decoration-on-top */
.blob{
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
  opacity: .75;
  animation: drift 18s var(--ease-in-out) infinite alternate;
}
.blob--a{
  width: 46vmax; height: 46vmax;
  left: -12vmax; top: -16vmax;
  background: radial-gradient(circle at 40% 40%, rgba(255, 186, 214, .95), rgba(255, 186, 214, 0) 68%);
}
.blob--b{
  width: 52vmax; height: 52vmax;
  right: -18vmax; bottom: -22vmax;
  background: radial-gradient(circle at 55% 50%, rgba(255, 205, 178, .8), rgba(255, 205, 178, 0) 66%);
  animation-delay: -7s;
  animation-duration: 23s;
}
@keyframes drift{
  from{ transform: translate3d(0, 0, 0) scale(1); }
  to  { transform: translate3d(3vmax, 2vmax, 0) scale(1.08); }
}

/* paper grain — an inline SVG, no network */
body::after{
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: .05;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

#fx{
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.stage{
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
}

/* ───────────── card ───────────── */
.card{
  position: relative;
  width: min(600px, 100%);
  padding: clamp(30px, 5.4vw, 58px) clamp(24px, 4.6vw, 52px) clamp(32px, 5vw, 52px);
  border-radius: 34px;
  text-align: center;
  background:
    linear-gradient(168deg, rgba(255, 255, 255, .9), rgba(255, 250, 252, .64) 58%, rgba(255, 240, 246, .58));
  box-shadow:
    0 34px 90px -34px rgba(176, 44, 96, .42),
    0 10px 30px -18px rgba(176, 44, 96, .28),
    inset 0 1px 0 rgba(255, 255, 255, .95),
    inset 0 0 0 1px rgba(255, 255, 255, .55);
  backdrop-filter: blur(16px) saturate(1.12);
  -webkit-backdrop-filter: blur(16px) saturate(1.12);
  transform-style: preserve-3d;
  will-change: transform;
  min-height: 340px;
  display: grid;
  place-items: center;
}

.card__main,
.card__done{
  grid-area: 1 / 1;
  width: 100%;
  transition: opacity .42s var(--ease-out), transform .5s var(--ease-out);
}

.card__main{ position: relative; }

.card__done{
  opacity: 0;
  transform: translateY(12px) scale(.985);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.card.is-done .card__main{
  opacity: 0;
  transform: translateY(-10px) scale(.99);
  pointer-events: none;
}
.card.is-done .card__done{
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition-delay: .1s;
}

.eyebrow{
  margin: 0 0 18px;
  font-size: 12px;
  letter-spacing: .34em;
  text-indent: .34em;
  color: var(--ink-soft);
  font-weight: 500;
}

.question{
  margin: 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Songti, SimSun, Georgia, serif;
  font-size: clamp(28px, 5.6vw, 44px);
  line-height: 1.34;
  font-weight: 700;
  letter-spacing: .02em;
  color: #40222f;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
}

.question span{
  display: inline-block;
  opacity: 0;
  transform: translate3d(0, 12px, 0);
  animation: char-in .62s var(--ease-out) forwards;
}
@keyframes char-in{
  to{ opacity: 1; transform: translate3d(0, 0, 0); }
}

.hint{
  margin: 18px 0 0;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink-soft);
  min-height: 23px;
  transition: opacity .3s var(--ease-out);
}

.actions{
  position: relative;
  margin-top: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  min-height: 54px;
}

.btn{
  font: inherit;
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 15px 30px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .16s var(--ease-out), box-shadow .24s var(--ease-out),
              background-color .24s ease, color .24s ease, opacity .3s ease;
}
.btn:focus-visible{
  outline: 2px solid rgba(234, 74, 128, .55);
  outline-offset: 3px;
}

.btn--yes{
  position: relative;
  color: #fff;
  background: linear-gradient(178deg, #ff8cb1, #ef4a83 62%, #e63977);
  box-shadow:
    0 18px 34px -16px rgba(230, 57, 119, .82),
    0 4px 12px -6px rgba(230, 57, 119, .5),
    inset 0 1px 0 rgba(255, 255, 255, .55);
  transform: scale(var(--grow, 1));
  will-change: transform;
}
.btn--yes::after{
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0 rgba(255, 140, 177, .55);
  animation: breathe 3.6s var(--ease-in-out) infinite;
  pointer-events: none;
}
@keyframes breathe{
  0%, 100%{ box-shadow: 0 0 0 0 rgba(255, 140, 177, .5); }
  50%     { box-shadow: 0 0 0 12px rgba(255, 140, 177, 0); }
}
.btn--yes:active{ transform: scale(calc(var(--grow, 1) * .97)); }

.btn--no{
  color: var(--ink-soft);
  background: rgba(255, 255, 255, .78);
  box-shadow:
    0 8px 20px -14px rgba(120, 60, 90, .9),
    inset 0 0 0 1px rgba(190, 120, 150, .34);
  white-space: nowrap;
  will-change: transform;
}

@media (hover: hover) and (pointer: fine){
  .btn--yes:hover{ transform: scale(calc(var(--grow, 1) * 1.045)); }
  .btn--no:hover{ background: rgba(255, 255, 255, .96); }
}

/* the one that runs away */
.btn--no.is-loose{
  position: fixed;
  left: 0;
  top: 0;
  margin: 0;
  z-index: 60;
  transition: transform .3s var(--ease-out), opacity .32s ease;
  box-shadow:
    0 14px 30px -18px rgba(120, 60, 90, .95),
    inset 0 0 0 1px rgba(190, 120, 150, .4);
}

/* ───────────── done state ───────────── */
.stamp{
  display: inline-block;
  margin-bottom: 6px;
  padding: 5px 12px;
  font-size: 11px;
  letter-spacing: .18em;
  color: #c2436f;
  border: 1px dashed rgba(194, 67, 111, .5);
  border-radius: 6px;
  transform: rotate(-3deg);
  background: rgba(255, 240, 246, .7);
}
.done-title{
  margin: 6px 0 2px;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Songti, SimSun, Georgia, serif;
  font-size: clamp(30px, 6vw, 44px);
  font-weight: 700;
  color: #c3366b;
  letter-spacing: .04em;
}
.lede{
  margin: 6px 0 0;
  font-size: 15.5px;
  line-height: 1.8;
  color: #5a3646;
  max-width: 28em;
}
.meta{
  margin: 4px 0 20px;
  font-size: 12px;
  letter-spacing: .06em;
  color: var(--ink-soft);
}
.btn--small{
  font-size: 14.5px;
  padding: 12px 24px;
}

/* ───────────── misc ───────────── */
.mute{
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: max(16px, env(safe-area-inset-right));
  z-index: 80;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  font-size: 17px;
  line-height: 1;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, .62);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7), 0 6px 18px -12px rgba(120, 60, 90, .9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background-color .2s ease, transform .16s var(--ease-out);
}
.mute:active{ transform: scale(.94); }
@media (hover: hover) and (pointer: fine){
  .mute:hover{ background: rgba(255, 255, 255, .92); }
}

.sr{
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.noscript{
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 99;
  background: #ffe6f0;
  color: #6b3b4e;
  font-size: 16px;
}

/* ───────────── reduced motion: gentler, not zero ───────────── */
@media (prefers-reduced-motion: reduce){
  .blob{ animation: none; }
  .btn--yes::after{ animation: none; }
  .question span{ animation-duration: .01ms; transform: none; }
  .card__main, .card__done{ transition-duration: .2s; }
  .btn--no.is-loose{ transition: opacity .2s ease; }
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="blob blob--a" aria-hidden="true"></div>
<div class="blob blob--b" aria-hidden="true"></div>

<main class="stage">
  <section class="card" id="card" aria-labelledby="question">
    <div class="card__main" id="mainPanel">
      <p class="eyebrow">一封没有署名的信</p>
      <h1 class="question" id="question"></h1>
      <p class="hint" id="hint">只有两个选项，但其中一个好像不太配合。</p>
      <div class="actions">
        <button class="btn btn--yes" id="yes" type="button">是的</button>
        <button class="btn btn--no" id="no" type="button">不是</button>
      </div>
    </div>

    <div class="card__done" id="donePanel" aria-hidden="true">
      <span class="stamp">同意书 · No.001</span>
      <h2 class="done-title">我就知道 </h2>
      <p class="lede">从今天起，你就是傻子<br>我会记得你今天点了哪一个按钮。</p>
      <p class="meta">签发于 <time id="today">今天</time> · 本页生成，永久有效</p>
      <button class="btn btn--yes btn--small" id="again" type="button">再问我一次</button>
    </div>
  </section>
</main>

<button class="mute" id="mute" type="button" aria-pressed="false" aria-label="声音：开" title="声音 开 / 关">🔊</button>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<noscript><div class="noscript">这一页要 JavaScript 才能撒个娇，请打开它。</div></noscript>

<script>
(() => {
  'use strict';

  // ── 想改成别的句子，只改这里 ────────────────────────────────
  const QUESTION = '你是傻子吗？';
  const NO_LABELS = [
    '不是',
    '真的不是吗？',
    '再想想嘛',
    '别急着拒绝',
    '我准备了好久',
    '再问一次好不好',
    '抓不到我哦',
    '其实…也没有别的选项',
    '好吧，我认输'
  ];
  const HINT_START = '只有两个选项，但其中一个好像不太配合。';
  const HINT_GONE  = '……它自己走了。那就只剩一个答案了。';
  // ───────────────────────────────────────────────────────────

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const card   = document.getElementById('card');
  const q      = document.getElementById('question');
  const hint   = document.getElementById('hint');
  const yes    = document.getElementById('yes');
  const no     = document.getElementById('no');
  const again  = document.getElementById('again');
  const muteEl = document.getElementById('mute');
  const live   = document.getElementById('live');
  const today  = document.getElementById('today');
  const actions = document.querySelector('.actions');

  const state = { done: false, dodges: 0, muted: false, loose: false, gone: false, lastDodge: 0 };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ── question: one span per character, 45ms stagger ── */
  function renderQuestion() {
    q.textContent = '';
    [...QUESTION].forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.animationDelay = (120 + i * 45) + 'ms';
      q.appendChild(s);
    });
    q.setAttribute('aria-label', QUESTION);
  }
  renderQuestion();

  today.textContent = new Date().toLocaleDateString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  /* ── audio: tiny WebAudio, no assets ── */
  let actx = null;
  function audio() {
    if (state.muted) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch { return null; }
  }
  function tone(freq, dur, type, gain, glideTo) {
    const ac = audio();
    if (!ac) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  const sfxPop   = () => tone(760, 0.11, 'sine', 0.05, 1240);
  const sfxSoft  = () => tone(420, 0.09, 'triangle', 0.03, 360);
  function sfxChime() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => tone(f, 0.5, 'sine', 0.055), i * 95);
    });
  }

  muteEl.addEventListener('click', () => {
    state.muted = !state.muted;
    muteEl.textContent = state.muted ? '🔇' : '🔊';
    muteEl.setAttribute('aria-pressed', String(state.muted));
    muteEl.setAttribute('aria-label', state.muted ? '声音：关' : '声音：开');
    if (!state.muted) sfxSoft();
  });

  /* ── canvas: ambient hearts, escape puffs, celebration burst, trail ── */
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function heartPath(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.beginPath();
    c.moveTo(0, r * 0.62);
    c.bezierCurveTo(-r * 1.06, -r * 0.18, -r * 0.62, -r * 1.06, 0, -r * 0.42);
    c.bezierCurveTo(r * 0.62, -r * 1.06, r * 1.06, -r * 0.18, 0, r * 0.62);
    c.closePath();
    c.fill();
    c.restore();
  }

  const ambient = [];
  const bursts = [];
  const trail = [];
  const AMBIENT_N = reduce ? 10 : 26;

  function seedAmbient() {
    ambient.length = 0;
    for (let i = 0; i < AMBIENT_N; i++) {
      ambient.push({
        x: rnd(0, W || 1200),
        y: rnd(-(H || 800), H || 800),
        r: rnd(5, 14),
        vy: rnd(9, 26),
        sway: rnd(0.4, 1.5),
        phase: rnd(0, Math.PI * 2),
        rot: rnd(-0.5, 0.5),
        vr: rnd(-0.35, 0.35),
        alpha: rnd(0.10, 0.32),
        hue: rnd(330, 352),
        sat: rnd(72, 95),
        light: rnd(72, 86)
      });
    }
  }

  function puff(cx, cy, n) {
    if (reduce) n = Math.min(n, 5);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const sp = rnd(60, 190);
      bursts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        r: rnd(3, 8),
        rot: rnd(-0.5, 0.5),
        vr: rnd(-3, 3),
        life: rnd(0.5, 0.9),
        maxLife: 0.9,
        alpha: rnd(0.35, 0.7),
        hue: rnd(332, 350),
        sat: rnd(80, 100),
        light: rnd(66, 80)
      });
    }
  }

  function celebrateBurst() {
    const cx = W / 2;
    const cy = H * 0.52;
    const n = reduce ? 24 : 110;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2);
      const sp = rnd(120, 520);
      bursts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 120,
        r: rnd(4, 11),
        rot: rnd(-0.6, 0.6),
        vr: rnd(-4, 4),
        life: rnd(0.9, 1.9),
        maxLife: 1.9,
        alpha: rnd(0.5, 0.9),
        hue: rnd(330, 356),
        sat: rnd(78, 100),
        light: rnd(62, 82)
      });
    }
  }

  function addTrail(x, y) {
    if (reduce || trail.length > 18) return;
    trail.push({ x, y, r: rnd(2, 4.5), life: 1, rot: rnd(-0.6, 0.6) });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.clearRect(0, 0, W, H);

    for (const p of ambient) {
      p.y += p.vy * dt;
      p.phase += dt * 0.9;
      p.x += Math.sin(p.phase) * p.sway * 14 * dt;
      p.rot += p.vr * dt;
      if (p.y - p.r > H) { p.y = -p.r * 2; p.x = rnd(0, W); }
      if (p.x < -30) p.x = W + 20;
      if (p.x > W + 30) p.x = -20;
      ctx.fillStyle = `hsla(${p.hue},${p.sat}%,${p.light}%,${p.alpha})`;
      heartPath(ctx, p.x, p.y, p.r, p.rot);
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life -= dt;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      b.vy += 380 * dt;
      b.vx *= 0.99;
      b.vy *= 0.99;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot += b.vr * dt;
      const a = clamp(b.life / b.maxLife, 0, 1);
      ctx.fillStyle = `hsla(${b.hue},${b.sat}%,${b.light}%,${a * b.alpha})`;
      heartPath(ctx, b.x, b.y, b.r * (0.55 + 0.45 * a), b.rot);
    }

    for (let i = trail.length - 1; i >= 0; i--) {
      const t = trail[i];
      t.life -= dt * 1.7;
      t.y -= 20 * dt;
      if (t.life <= 0) { trail.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(340,88%,74%,${t.life * 0.42})`;
      heartPath(ctx, t.x, t.y, t.r * t.life, t.rot);
    }

    requestAnimationFrame(frame);
  }

  resize();
  seedAmbient();
  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    resize();
    seedAmbient();
    if (state.loose && !state.gone) clampNoIntoView();
  });

  /* ── the button that does not want to be clicked ── */
  function loosen() {
    if (state.loose) return;
    // 逃之前先把它挪到 <body> 下：卡片上有 backdrop-filter/transform，
    // 会成为 fixed 后代的包含块，坐标会整体偏移。
    const r = no.getBoundingClientRect();
    document.body.appendChild(no);
    no.classList.add('is-loose');
    no.style.transition = 'none';
    no.style.transform = `translate3d(${r.left}px, ${r.top}px, 0) scale(1) rotate(0deg)`;
    void no.offsetWidth;
    no.style.transition = '';
    state.loose = true;
  }

  function clampNoIntoView() {
    const r = no.getBoundingClientRect();
    if (!r.width) return;
    const m = 14;
    const x = clamp(r.left, m, Math.max(m, W - r.width - m));
    const y = clamp(r.top, m, Math.max(m, H - r.height - m));
    if (x !== r.left || y !== r.top) {
      no.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${currentScale()}) rotate(0deg)`;
    }
  }

  function currentScale() {
    return Math.max(0.55, 1 - state.dodges * 0.05);
  }

  /* keep the 「可以」 button from jumping when its neighbour leaves the row */
  function flipYes(mutate) {
    if (reduce) { mutate(); return; }
    const first = yes.getBoundingClientRect();
    mutate();
    const lastRect = yes.getBoundingClientRect();
    const dx = first.left - lastRect.left;
    const dy = first.top - lastRect.top;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
    const grow = yes.style.getPropertyValue('--grow') || '1';
    yes.style.transition = 'none';
    yes.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${grow})`;
    void yes.offsetWidth;
    yes.style.transition = '';
    requestAnimationFrame(() => {
      yes.style.transform = `translate3d(0, 0, 0) scale(${grow})`;
      setTimeout(() => { yes.style.transform = ''; }, 420);
    });
  }

  function dodge(px, py) {
    if (state.done || state.gone) return;
    const t = performance.now();
    if (t - state.lastDodge < 240) return;   // 一次点击只算一步，别被 pointermove+click 连吃两下
    state.lastDodge = t;

    const wasLoose = state.loose;
    if (!wasLoose) {
      const before = no.getBoundingClientRect();
      flipYes(() => loosen());
      const after = no.getBoundingClientRect();
      if (Math.abs(before.left - after.left) > 0.5 || Math.abs(before.top - after.top) > 0.5) {
        // loosen() pinned it to its own rect already; nothing else to restore
      }
    }

    const r = no.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    let angle = Math.atan2(cy - py, cx - px);
    if (!isFinite(angle)) angle = rnd(0, Math.PI * 2);
    angle += rnd(-0.55, 0.55);

    const dist = rnd(170, 300);
    const m = 16;
    let nx = 0, ny = 0;

    for (let attempt = 0; attempt < 10; attempt++) {
      nx = clamp(cx + Math.cos(angle) * dist - r.width / 2, m, Math.max(m, W - r.width - m));
      ny = clamp(cy + Math.sin(angle) * dist - r.height / 2, m, Math.max(m, H - r.height - m));
      if (!hitsYes(nx, ny, r.width, r.height)) break;
      angle += rnd(1.1, 2.4);
    }

    state.dodges++;
    const scale = currentScale();
    no.style.transform =
      `translate3d(${nx}px, ${ny}px, 0) scale(${scale}) rotate(${rnd(-7, 7).toFixed(1)}deg)`;
    no.textContent = NO_LABELS[Math.min(state.dodges, NO_LABELS.length - 1)];

    yes.style.setProperty('--grow', (1 + Math.min(state.dodges, 8) * 0.05).toFixed(3));

    puff(cx, cy, 5 + Math.min(state.dodges, 6));
    sfxPop();
    live.textContent = `第 ${state.dodges} 次：它躲开了。`;

    if (state.dodges >= 9) vanishNo();
  }

  function hitsYes(x, y, w, h) {
    const y0 = yes.getBoundingClientRect();
    const pad = 12;
    return !(x + w < y0.left - pad || x > y0.right + pad ||
             y + h < y0.top - pad || y > y0.bottom + pad);
  }

  function vanishNo() {
    state.gone = true;
    const r = no.getBoundingClientRect();
    puff(r.left + r.width / 2, r.top + r.height / 2, 18);
    no.style.transform += ' scale(0.6) rotate(26deg)';
    no.style.opacity = '0';
    no.style.pointerEvents = 'none';
    no.textContent = '……';
    hint.textContent = HINT_GONE;
    live.textContent = '「不要」自己走了，只剩下一个选项。';
    setTimeout(sfxSoft, 120);
  }

  /* proximity check, throttled to ~30fps */
  let lastCheck = 0;
  window.addEventListener('pointermove', (e) => {
    if (state.done) return;

    addTrail(e.clientX, e.clientY);

    if (e.pointerType !== 'mouse') return;

    const now = performance.now();
    if (now - lastCheck < 32) return;
    lastCheck = now;

    if (state.gone) return;
    const r = no.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const reach = 132 + Math.min(state.dodges * 5, 48);
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < reach) dodge(e.clientX, e.clientY);
  }, { passive: true });

  /* touch: tap = escape, not a refusal */
  no.addEventListener('pointerdown', (e) => {
    if (state.gone || state.done) return;
    if (e.pointerType === 'mouse') return;      // mouse is handled by proximity
    e.preventDefault();
    dodge(e.clientX, e.clientY);
  });

  /* keyboard: focusing or pressing it also sends it running */
  no.addEventListener('focus', () => {
    if (state.gone || state.done) return;
    const r = no.getBoundingClientRect();
    dodge(r.left + r.width / 2, r.top + r.height / 2);
  });

  no.addEventListener('click', (e) => {
    if (state.gone || state.done) return;
    e.preventDefault();
    const r = no.getBoundingClientRect();
    dodge(r.left + r.width / 2, r.top + r.height / 2);
  });

  /* ── yes ── */
  function celebrate() {
    if (state.done) return;
    state.done = true;
    live.textContent = '它答应了。';
    if (state.loose) { no.style.opacity = '0'; no.style.pointerEvents = 'none'; }
    card.classList.add('is-done');
    document.getElementById('donePanel').setAttribute('aria-hidden', 'false');
    document.getElementById('mainPanel').setAttribute('aria-hidden', 'true');
    document.title = '你就是傻子';
    celebrateBurst();
    sfxChime();
    setTimeout(() => again.focus({ preventScroll: true }), 380);
  }

  yes.addEventListener('click', celebrate);

  /* ── reset ── */
  function reset() {
    state.done = false;
    state.dodges = 0;
    state.gone = false;
    state.loose = false;

    card.classList.remove('is-done');
    document.getElementById('donePanel').setAttribute('aria-hidden', 'true');
    document.getElementById('mainPanel').removeAttribute('aria-hidden');
    document.title = '可以做傻子吗？';

    no.classList.remove('is-loose');
    actions.appendChild(no);
    no.removeAttribute('style');
    no.textContent = NO_LABELS[0];
    no.disabled = false;

    yes.style.removeProperty('--grow');
    yes.removeAttribute('style');

    hint.textContent = HINT_START;
    bursts.length = 0;
    trail.length = 0;

    renderQuestion();
    live.textContent = '重新开始。';
    yes.focus({ preventScroll: true });
  }

  again.addEventListener('click', reset);

  /* ── gentle parallax tilt, mouse only ── */
  if (!reduce && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let ticking = false;
    window.addEventListener('pointermove', (e) => {
      if (state.done || ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const rx = ((e.clientY / H) - 0.5) * -3.2;
        const ry = ((e.clientX / W) - 0.5) * 3.2;
        card.style.transform = `perspective(1100px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
        ticking = false;
      });
    }, { passive: true });
  }

  /* keyboard shortcut: Enter / Space on the page answers for them */
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t instanceof HTMLElement && (t.tagName === 'BUTTON' || t.tagName === 'A')) return;
    e.preventDefault();
    if (state.done) reset(); else celebrate();
  });
})();
</script>
</body>
</html>
